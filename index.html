<!DOCTYPE html>
<html>

        <h1>CRAZY SIGMA BULLET HELL</h1>

                <h2>Leaderboard</h2>
                <ol id="leaderboardList"></ol>

              <div class="menuPanel">

            </div>
        </div>
    </div>
    <div id="score">SCORE 0</div>
    <div id="box"></div>
    <script src="gamelogic.js"></script>
